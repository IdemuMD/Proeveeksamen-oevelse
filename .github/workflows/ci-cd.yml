name: CI-CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: ci
    strategy:
      matrix:
        include:
          - name: frontend
            host_secret: FRONTEND_SSH_HOST
            user_secret: FRONTEND_SSH_USER
            key_secret: FRONTEND_SSH_KEY
            service: foxvote-frontend
          - name: backend
            host_secret: BACKEND_SSH_HOST
            user_secret: BACKEND_SSH_USER
            key_secret: BACKEND_SSH_KEY
            service: foxvote-backend
    steps:
      - name: Deploy ${{ matrix.name }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets[matrix.host_secret] }}
          username: ${{ secrets[matrix.user_secret] }}
          key: ${{ secrets[matrix.key_secret] }}
          script: |
            set -e
            cd /opt/foxvote
            git pull origin main
            npm ci
            npm run build
            sudo systemctl restart ${{ matrix.service }}
