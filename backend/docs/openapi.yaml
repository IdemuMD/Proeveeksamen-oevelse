openapi: 3.0.3
info:
  title: FoxVote API
  version: 1.0.0
  description: API for tilfeldig rev-duell, stemmegivning og statistikk.
servers:
  - url: http://10.12.2.222:4000
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/foxes/pair:
    get:
      summary: Hent to ulike tilfeldige rever
      responses:
        "200":
          description: Distinkt revepar
          content:
            application/json:
              schema:
                type: object
                properties:
                  left:
                    $ref: "#/components/schemas/FoxCandidate"
                  right:
                    $ref: "#/components/schemas/FoxCandidate"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/votes:
    post:
      summary: Registrer en stemme og hent oppdatert statistikk + nytt par
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteRequest"
      responses:
        "200":
          description: Stemmen er registrert
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  leader:
                    $ref: "#/components/schemas/FoxStats"
                  top:
                    type: array
                    items:
                      $ref: "#/components/schemas/FoxStats"
                  nextPair:
                    oneOf:
                      - type: object
                        properties:
                          left:
                            $ref: "#/components/schemas/FoxCandidate"
                          right:
                            $ref: "#/components/schemas/FoxCandidate"
                      - type: "null"
                  warning:
                    oneOf:
                      - type: string
                      - type: "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          description: For mange forespørsler
  /api/stats/top:
    get:
      summary: Hent toppliste over mest populære rever
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 20
          required: false
      responses:
        "200":
          description: Liste med topprangerte rever
          content:
            application/json:
              schema:
                type: object
                properties:
                  top:
                    type: array
                    items:
                      $ref: "#/components/schemas/FoxStats"
  /api/stats/leader:
    get:
      summary: Hent reven som leder akkurat nå
      responses:
        "200":
          description: Lederdata
          content:
            application/json:
              schema:
                type: object
                properties:
                  leader:
                    oneOf:
                      - $ref: "#/components/schemas/FoxStats"
                      - type: "null"
components:
  schemas:
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
    FoxCandidate:
      type: object
      required: [foxId, imageUrl]
      properties:
        foxId:
          type: integer
          minimum: 1
        imageUrl:
          type: string
          format: uri
          example: https://randomfox.ca/images/45.jpg
    VoteRequest:
      type: object
      required: [foxId, imageUrl]
      properties:
        foxId:
          type: integer
          minimum: 1
        imageUrl:
          type: string
          format: uri
    FoxStats:
      type: object
      required: [foxId, imageUrl, votes]
      properties:
        foxId:
          type: integer
          minimum: 1
        imageUrl:
          type: string
          format: uri
        votes:
          type: integer
          minimum: 0
  responses:
    BadRequest:
      description: Ugyldig forespørsel
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Tjenesten er midlertidig utilgjengelig
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
